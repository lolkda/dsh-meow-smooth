name: Verify and publish npm package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Select OIDC-capable npm
        run: npm install --global npm@11.19.0 --registry=https://registry.npmjs.org
      - name: Install locked dependencies
        run: npm ci
      - name: Check types
        run: npm run typecheck
      - name: Test sidebar navigation
        run: npm run test:sidebar-mobile
      - name: Test package verifier offline
        run: node --test scripts/verify-package.test.mjs
      - name: Build package
        run: npm run build
      - name: Pack and verify release contents
        shell: bash
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p dist
          npm pack --ignore-scripts --json --pack-destination dist > dist/pack.json
          args=(--pack-json dist/pack.json --repository "$EXPECTED_REPOSITORY")
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            args+=(--tag "$GITHUB_REF_NAME")
          fi
          node scripts/verify-package.mjs "${args[@]}"
      - name: Preserve the verified tarball
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Select OIDC-capable npm
        run: npm install --global npm@11.19.0 --registry=https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: dist
      - name: Publish the verified tarball with OIDC
        shell: bash
        run: |
          tarballs=(./dist/*.tgz)
          [[ ${#tarballs[@]} -eq 1 && -f "${tarballs[0]}" ]]
          npm publish "${tarballs[0]}" --ignore-scripts --access public --registry=https://registry.npmjs.org
